name: blast-hmmer-datax
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # Search and alignment tools. None of these are pip-installable, which is
  # why conda/micromamba is the supported way to set the project up.
  - blast=2.16.0
  - hmmer=3.4
  - mafft=7.526
  # Clustering for the profile HMM layer. Only the reference build uses it.
  - mmseqs2=18.8cc5c
  # Optional fourth aligner, used by `make poc-diamond`. The BLAST and HMMER
  # pipeline runs without it.
  - diamond=2.2.4
  - pip
  - pip:
      # Web application and copied-database access, pinned to the versions
      # this was built and tested against.
      - fastapi==0.121.2
      - uvicorn[standard]==0.41.0
      - jinja2==3.1.6
      - pydantic==2.13.1
      - pydantic-settings==2.13.0
      - python-multipart==0.0.20
      - PyMySQL==1.1.2
      # Required for MySQL 8's default caching_sha2_password auth.
      - cryptography==46.0.4
      # Proof-of-concept scripts.
      - requests==2.32.5
      - pandas==2.2.3
      # Tests.
      - pytest==8.4.2
      - httpx==0.28.1
